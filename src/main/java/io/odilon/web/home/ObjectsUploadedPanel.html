<wicket:panel>

	<div wicket:id="container" class="card mb-4">
		<div class="card-header">
			<h3 class="mb-0" style="font-size: 1em; font-weight: bold; text-transform: uppercase;">
				<wicket:message key="title" />
			</h3>
		</div>
		<div class="card-body pt-2 pb-2">
			<span class="small text-uppercase fw-bold me-2"><wicket:message key="bucket" /></span>
			<select wicket:id="bucket" class="form-select form-select-sm d-inline-block w-auto"></select>
		</div>
		<table class="table table-sm table-borderless mb-0">
			<tbody>
				<tr wicket:id="rows">
					<td class="ps-3 pt-2 pb-2 text-muted col-4"><span wicket:id="label">[label]</span></td>
					
					<td class="pe-3 pt-2 pb-2 col-8"><span wicket:id="value">[value]</span></td>
				</tr>
			</tbody>
		</table>
		<div class="card-footer small text-muted">
			<wicket:message key="metered" />: <span wicket:id="metered">[metered]</span>
		</div>
	</div>

</wicket:panel>
