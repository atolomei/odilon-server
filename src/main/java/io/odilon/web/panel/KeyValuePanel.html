<wicket:panel>

	<div class="card mb-4"  style="margin-bottom: -1px;">
		<div class="card-header">
			<h3 class="mb-0 pt-1 pb-1" style="font-size: 1em; font-weight: bold; text-transform: uppercase;" wicket:id="title">[title]</h3>
		</div>
		<div class="card-body p-0">

			
			<div class="row">
				<div class="col-12">
				<table class="table table-borderless table-sm mb-0">
					<tbody>
						<tr wicket:id="rows">
							<td class="ps-3 pt-2 pb-2 text-muted col-4" wicket:id="key">[key]</td>
							<td class="pe-3 pt-2 pb-2 col-8" wicket:id="value">[value]</td>
						</tr>
					</tbody>
				</table>
				</div>

			</div>


			<!-- div class="row">
				<div class="col-12 col-lg-12 mt-3">
					<a href="/ui/search">Search</a>
				</div>
				
			</div -->


		</div>
	</div>

</wicket:panel>
