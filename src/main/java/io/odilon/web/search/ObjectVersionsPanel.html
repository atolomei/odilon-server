<wicket:panel>

	<div class="fw-bold small text-uppercase mt-4 mb-2">
		<wicket:message key="versions" />
	</div>

	<table class="table table-sm table-bordered mb-4">
		<thead>
			<tr>
				<th scope="col" class="text-center" style="width: 10%;"><wicket:message key="version" /></th>
				<th scope="col" class="text-center" style="width: 20%;"><wicket:message key="lastModified" /></th>
				<th scope="col" class="ps-2"><wicket:message key="file" /></th>
			</tr>
		</thead>
		<tbody>
			<tr wicket:id="rows">
				<!-- col 1. version number -->
				<td class="text-center"><span  wicket:id="version">[version]</span></td>

				<!-- col 2. last modified date -->
				<td class="text-center"><span wicket:id="lastmodified">[lastmodified]</span></td>

				<!-- col 3. link (filename in bold) + metadata, one field per line -->
				<td class="ps-2 pb-2">
					<a wicket:id="link-head" target="_blank" class=" text-decoration-none"><b><span wicket:id="filename">[filename]</span></b></a>
					<a wicket:id="link-version" class="text-decoration-none" target="_blank"><b><span wicket:id="filename">[filename]</span></b></a>
					<ul class="ps-0 text-muted mb-0 mt-1">
						<li class="pt-1" style="list-style-type: none;" wicket:id="fields"><span wicket:id="field">[field]</span></li>
					</ul></td>
			</tr>
		</tbody>
	</table>

</wicket:panel>
