<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
	<wicket:extend>

		<main class="container-xxl main">

			<div class="row">
				<div class="col-12 mt-4">
					<h1><wicket:message key="title" /></h1>
				</div>
			</div>

			<div class="row">
				<div class="col-12 col-lg-12 mt-3">
					<div wicket:id="hardware"></div>
				</div>
			</div>

			<div class="row">
				<div class="col-12 col-lg-12 mt-3">
					<div wicket:id="status"></div>
				</div>
			</div>

			<div class="row">
				<div class="col-12 col-lg-12 mt-3">
					<div wicket:id="resources"></div>
				</div>
			</div>

			<div class="row">
				<div class="col-12 col-lg-12 mt-3">
					<div wicket:id="jvm"></div>
				</div>
			</div>

			<div class="row">
				<div class="col-12 col-lg-12 mt-3">
					<div wicket:id="systemmetrics"></div>
				</div>
			</div>

		</main>

	</wicket:extend>
</body>
</html>
