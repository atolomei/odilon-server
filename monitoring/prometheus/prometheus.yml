
global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "odilon"
    metrics_path: /actuator/prometheus
    basic_auth:
      username: monitor        # monitor.accessKey in odilon.properties
      password: odilon         # monitor.secretKey in odilon.properties
    static_configs:
      - targets: ["localhost:9234"]

